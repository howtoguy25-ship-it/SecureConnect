databases:
  - name: pryvo-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: pryvo-server
    runtime: node
    plan: starter
    # Builds both halves of the app: the web bundle (served at /app/* —
    # see server/index.ts's static serving block) and the server bundle.
    # scripts/build.js (npm run expo:static:build) is Replit-specific
    # (spawns a dev-server-style Metro process), so this uses a plain
    # `expo export` instead, which is what actually gets tested locally.
    #
    # --include=dev: NODE_ENV=production (set below) makes a plain
    # `npm install` prune ALL devDependencies, including build-only tools
    # (esbuild, babel-plugin-module-resolver, etc.) that the build steps
    # on this line actually need even though they're not runtime deps.
    # Hit this as two separate failures before adding this flag instead
    # of promoting every missing dev tool into "dependencies" one at a
    # time.
    # EXPO_BASE_URL=/app tells the web export to emit asset paths prefixed
    # with /app (app.config.js experiments.baseUrl) — the web bundle is
    # mounted at /app (see server/index.ts), but a plain `expo export`
    # always writes domain-root-absolute paths like `/_expo/static/...`
    # into index.html. Without this, index.html loads fine but its <script>
    # tag 404s against the domain root, leaving #root empty (blank screen).
    buildCommand: npm install --include=dev && EXPO_BASE_URL=/app npx expo export -p web --output-dir web-build && npm run server:build
    # Runs after build, before the new instance takes traffic, with the
    # same env vars as the service — including the internal DATABASE_URL,
    # which this sandbox can't reach directly (only HTTPS is proxied out,
    # not raw Postgres TCP). The production DB never actually had its
    # schema applied (only a local throwaway test DB got `drizzle-kit
    # push` during earlier work), which is why every DB-backed request
    # was failing with "relation ... does not exist". --force skips the
    # interactive confirmation prompt drizzle-kit push would otherwise
    # block on in a non-interactive deploy.
    preDeployCommand: npx drizzle-kit push --force
    startCommand: npm run server:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pryvo-db
          property: connectionString
      # Required in production (server fails closed without these — see
      # server/routes.ts JWT_SECRET and server/smsEncryption.ts
      # ENCRYPTION_KEY). Generate real random 32+ char values and set
      # them in the Render dashboard rather than committing them here.
      - key: SESSION_SECRET
        sync: false
      - key: SMS_ENCRYPTION_KEY
        sync: false
      # Your production domain — used for CORS, webhook base URLs, and
      # baked into the app's API_URL at EAS build time (see eas.json).
      - key: EXPO_PUBLIC_DOMAIN
        value: pryvoapp.com
      # Optional integrations — the server degrades gracefully without
      # these (Stripe/Twilio/LiveKit/GCS features just stay disabled),
      # but set the ones you use in the Render dashboard.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Optional: a WhatsApp-enabled Twilio sender (separate resource from
      # TWILIO_PHONE_NUMBER — needs its own Meta/WhatsApp Business approval).
      # Falls back to TWILIO_PHONE_NUMBER if unset, which will fail sends
      # until a real WhatsApp sender is provisioned.
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      # Optional: enables Google Sign-In. Must be a "Web application" OAuth
      # client ID from Google Cloud Console (used as GoogleSignin's
      # webClientId client-side so the idToken it returns is verifiable
      # here). Google Sign-In stays hidden in the app until this is set —
      # see GET /api/auth/oauth-config.
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      # Optional: only needed if APP_BUNDLE_ID ever differs from
      # com.adham.salameh.secureconnectchat (the default baked into
      # server/oauthVerify.ts).
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_IDENTITY_SECRET
        sync: false
      - key: GCS_SERVICE_ACCOUNT_KEY
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      - key: OWNER_PHONE_NUMBER
        sync: false
